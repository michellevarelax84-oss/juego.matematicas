<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Matemática Kids</title>

<link rel="stylesheet" href="css/estilo_actividad2.css">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</head>

<body>

<div id="app">

    <!-- ========================= -->
    <!-- PANTALLA INICIO -->
    <!-- ========================= -->

    <section id="pantallaInicio">

        <div class="card">

            <h1>🧠 Matemática Kids</h1>

            <p id="textoBienvenida">

                👋 ¡Bienvenida!

                <br><br>

                Suma con nosotros y conviértete en una súper matemática.

            </p>

            <button id="btnComenzar">

                🚀 Comenzar

            </button>

        </div>

    </section>

    <!-- ========================= -->
    <!-- PANTALLA JUEGO -->
    <!-- ========================= -->

    <section id="pantallaJuego">

        <!-- CABECERA -->

        <div id="cabecera">

            <div id="estrellasBox">

                ⭐ Estrellas:
                <span id="estrellas">0</span>

            </div>

            <div id="nivelBox">

                📊 Nivel:
                <span id="nivel">1</span>/4

            </div>

        </div>

        <!-- BARRA -->

        <div id="progreso">

            <div id="barra"></div>

        </div>

        <!-- TARJETA -->

        <div class="card">

            <h2 id="tituloJuego">

                🛒 Mercado Matemático

            </h2>

            <!-- ========================= -->
            <!-- OPERACIÓN CON FRUTAS -->
            <!-- ========================= -->

            <div id="operacionFrutas">

                <div id="grupo1" class="grupoObjetos">

                </div>

                <div class="signo">

                    +

                </div>

                <div id="grupo2" class="grupoObjetos">

                </div>

            </div>

            <!-- ========================= -->
            <!-- OPERACIÓN CON NÚMEROS -->
            <!-- ========================= -->

            <div id="operacionNumeros">

                <div class="numeroGrande" id="numero1">

                    23

                </div>

                <div class="signo">

                    +

                </div>

                <div class="numeroGrande" id="numero2">

                    15

                </div>

            </div>

            <!-- RESULTADO -->

            <div id="resultado">

                = ?

            </div>

            <!-- RESPUESTA -->

            <input
            type="number"
            id="respuesta"
            placeholder="Escribe tu respuesta">

            <br>

            <button id="btnComprobar">

                ✨ Comprobar

            </button>

            <!-- MENSAJE -->

            <div id="mensaje"></div>

        </div>

    </section>

    <!-- ========================= -->
    <!-- PANTALLA FINAL -->
    <!-- ========================= -->

    <section id="pantallaFinal">

        <div class="card">

            <h1>

                🏆 ¡Felicitaciones!

            </h1>

            <p>

                Terminaste todos los desafíos.

            </p>

            <div id="estrellasFinal">

                ⭐⭐⭐⭐

            </div>

            <button id="btnReiniciar">

                🔄 Jugar nuevamente

            </button>

        </div>

    </section>

</div>

<script src="js/script_actividad2.js"></script>

</body>

</html>
