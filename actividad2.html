<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Matemática Kids</title>

<link rel="stylesheet" href="css/estilo_actividad2.css?v=1.3">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

</head>

<body>

  <!-- Fondo ambiental interactivo -->
  <div class="bg-animation">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>
  </div>

  <div class="game-container" id="pantallaJuego">
    <header>
      <h1 class="game-title">Aventura de las Sumas</h1>
      
      <!-- Barra de Progreso de Obstáculos -->
      <div class="progress-bar-container">
        <div class="progress-line"></div>
        <div class="progress-line-fill" id="progress-fill"></div>
        <div class="progress-step active" id="step-1">1</div>
        <div class="progress-step" id="step-2">2</div>
        <div class="progress-step" id="step-3">3</div>
        <div class="progress-step" id="step-4">4</div>
      </div>
    </header>

    <!-- Panel de Instrucciones visible durante el juego -->
    <div class="gameplay-instructions" id="gameplay-instructions">
      <span class="instruction-icon" id="gameplay-icon">⚡</span>
      <p class="instruction-text" id="gameplay-text">Resuelve las sumas completando los desafíos.</p>
      <button class="icon-btn-speak" id="gameplay-speak-btn" title="Escuchar instrucciones">🔊</button>
    </div>

    <!-- Contenedor del Juego -->
    <div class="card" style="width: 100%; max-width: 850px; margin-top: 10px;">
      <!-- Marcadores de Estrellas -->
      <div style="display: flex; gap: 20px; width: 100%; margin-bottom: 20px;">
        <div id="estrellasBox" style="margin: 0; flex: 1;">
          ⭐ Estrellas: <span id="estrellas">0</span>
        </div>
        <div id="nivelBox" style="margin: 0; flex: 1;">
          Obstáculo: <span id="nivel">1</span>/4
        </div>
      </div>

      <h2 id="tituloJuego">🛒 Mercado Matemático</h2>

      <!-- OPERACIÓN CON FRUTAS -->
      <div id="operacionFrutas" style="display: flex; justify-content: center; align-items: center; gap: 25px; margin: 25px 0; flex-wrap: wrap;">
          <div id="grupo1" class="grupoObjetos"></div>
          <div class="signo">+</div>
          <div id="grupo2" class="grupoObjetos"></div>
      </div>

      <!-- OPERACIÓN CON NÚMEROS -->
      <div id="operacionNumeros" style="display: none; justify-content: center; align-items: center; gap: 25px; margin: 25px 0;">
          <div class="numeroGrande" id="numero1">23</div>
          <div class="signo">+</div>
          <div class="numeroGrande" id="numero2">15</div>
      </div>

      <!-- RESULTADO -->
      <div id="resultado" style="font-size: 38px; font-weight: 800; margin: 15px; color: #1e1b4b;">= ?</div>

      <!-- RESPUESTA -->
      <div style="margin: 25px 0;">
        <input type="number" id="respuesta" placeholder="Escribe tu respuesta">
      </div>

      <button id="btnComprobar">
          ✨ Comprobar
      </button>

      <div id="mensaje"></div>
    </div>
  </div>

  <!-- PANTALLA FINAL -->
  <div id="pantallaFinal" style="display:none; text-align:center;">
      <h1>🏆 ¡Felicitaciones!</h1>
      <p>Terminaste todos los desafíos de sumas.</p>
      <div id="estrellasFinal" style="font-size: 45px; margin: 20px 0;">⭐⭐⭐⭐</div>
      <button id="btnReiniciar">
          🔄 Jugar nuevamente
      </button>
  </div>

  <!-- MODAL DE INSTRUCCIONES / VICTORIA -->
  <div class="modal-overlay" id="instruction-modal">
    <div class="modal-card">
      <span class="modal-icon" id="modal-icon">🎯</span>
      <h2 class="modal-title" id="modal-title">Obstáculo 1</h2>
      <div style="display: flex; justify-content: center; margin: 10px 0 20px 0;">
        <button class="btn-action" id="modal-speak-btn" style="padding: 8px 16px; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.08); box-shadow: none; border: 1px solid rgba(255,255,255,0.12); border-radius: 50px;">
          🔊 Escuchar Explicación
        </button>
      </div>
      <p class="modal-desc" id="modal-desc">Prepárate para iniciar.</p>
      <div class="modal-buttons-container" style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 10px; width: 100%;">
        <button class="btn-action" id="modal-start-btn">Comenzar</button>
      </div>
    </div>
  </div>

<audio id="audioCorrecto" src="sonidos/correcto.mp3"></audio>
<audio id="audioError" src="sonidos/error.mp3"></audio>
<audio id="audioAplausos" src="sonidos/confite.mp3"></audio>

<script src="js/script_actividad2.js?v=1.3"></script>

</body>

</html>
